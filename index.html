<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Asistencia</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4 text-center" id="app">
    <div class="spinner-border text-primary" id="loading"></div>
    <div id="contenido"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzFVJO6dTxY__aSBuJ1x-yCIQqscY6En0NihIpn_g5U0d2XSETK_Ng5eG2ZGEpRhn4f/exec";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    document.addEventListener("DOMContentLoaded", () => {
      const p = new URLSearchParams(window.location.search);
      const tipo = p.get('t') || '';
      const uid = p.get('uid') || '';

      fetch(`${API_URL}?t=${tipo}&uid=${uid}`)
        .then(r => r.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          
          let nombre = data.alumno || data.tutor;
          let det = data.grupo || data.estudiante || '';

          if (nombre) {
            document.getElementById('contenido').innerHTML = `
              <h3>Bienvenido: ${nombre}</h3>
              ${det ? `<p class="text-muted">${det}</p>` : ''}
            `;
          } else {
            document.getElementById('contenido').innerHTML = `
              <h3 class="text-danger">Registro no encontrado</h3>
              <p class="text-muted">${data.mensaje || data.error || 'Verifica los datos'}</p>
            `;
          }
        })
        .catch(err => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('contenido').innerHTML = `<h3 class="text-danger">Error de conexión</h3>`;
        });
    });
  </script>
</body>
</html>
